    <text x="132" y="82" font-size="62" stroke-width="14" fill="#fff" transform="rotate(-2 132 82)">ПЬЯНОЕ</text>
    <text x="132" y="152" font-size="62" stroke-width="14" fill="#fff" transform="rotate(1 132 152)">КАРАОКЕ</text>
    <g clip-path="url(#half)">
