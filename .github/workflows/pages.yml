# Сборка сайта: основная ветка даёт приложение, ветка songs — песни.
# Песни в main не хранятся и локальными правками не затрагиваются.
name: Публикация сайта

on:
  push:
    branches: [main, songs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Основная ветка
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ветка с песнями
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: songs
          path: .songs

      - name: Подмешать песни
        run: |
          mkdir -p dist/songs
          if [ -d .songs ]; then
            find .songs -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -R {} dist/songs/ \;
          fi
          rm -rf .songs
          echo "Папок с песнями: $(find dist/songs -mindepth 1 -maxdepth 1 -type d | wc -l)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Собрать список датасетов
        run: node scripts/corpora.mjs

      - name: Собрать список песен
        env:
          SONGS_CDN_BASE: https://cdn.jsdelivr.net/gh/barinboim/drunk-karaoke@songs
        run: node scripts/library.mjs dist/songs

      - name: Не включать песни в Pages-артефакт
        run: rm -rf dist/songs

      - name: Проверить, что ничего не сломано
        run: npm test

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
